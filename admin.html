
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BorrowBuddy - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#26344a}
header{background:#173b68;color:white;padding:22px}
main{max-width:1100px;margin:25px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 9px #0001}
input,button{padding:11px;border-radius:6px;border:1px solid #ccc;margin:5px 0}
input{width:100%}
button{background:#1769aa;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5}
.approve{background:#218838}
.reject{background:#c0392b}
.logout{background:#555}
.item{padding:15px;border:1px solid #ddd;border-radius:8px;margin:12px 0}
.status{font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h2>BorrowBuddy Administrator</h2>
<p>Equipment and Student Request Management</p>
</header>

<main>

<section id="loginSection" class="card">
<h2>Administrator Login</h2>
<input type="email" id="email" placeholder="Admin email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login as Admin</button>
<p id="message"></p>
</section>

<section id="adminDashboard" class="hidden">

<div class="card">
<h2>Welcome, Administrator</h2>
<p>Manage student borrowing requests and equipment.</p>
<button id="refreshBtn">Refresh Requests</button>
<button id="logoutBtn" class="logout">Logout</button>
</div>

<div class="card">
<h2>Pending Borrowing Requests</h2>
<div id="pendingRequests">Loading requests...</div>
</div>

<div class="card">
<h2>All Borrowing Records</h2>
<div id="allRequests">Loading records...</div>
</div>

<div class="card">
<h2>Equipment Management</h2>
<div id="equipmentList">Loading equipment...</div>
</div>

</section>
</main>

<script type="module">
import { auth, db } from "./firebase-config.js";

import {
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
collection, doc, getDoc, getDocs,
query, where, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
let adminUser = null;

$("loginBtn").onclick = async () => {
try {
await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);
} catch(error) {
$("message").textContent = error.message;
}
};

$("logoutBtn").onclick = () => signOut(auth);

$("refreshBtn").onclick = async () => {
await loadRequests();
await loadEquipment();
};

onAuthStateChanged(auth, async user => {
if (!user) {
adminUser = null;
$("loginSection").classList.remove("hidden");
$("adminDashboard").classList.add("hidden");
return;
}

try {
const userSnap = await getDoc(doc(db,"users",user.uid));

if (!userSnap.exists() || userSnap.data().role !== "admin") {
alert("Access denied. Administrator account required.");
await signOut(auth);
return;
}

adminUser = user;

$("loginSection").classList.add("hidden");
$("adminDashboard").classList.remove("hidden");

await loadRequests();
await loadEquipment();

} catch(error) {
$("message").textContent = error.message;
}
});

// Load student requests
async function loadRequests() {
if (!adminUser) return;

$("pendingRequests").textContent = "Loading...";
$("allRequests").textContent = "Loading...";

try {
const snapshot = await getDocs(collection(db,"requests"));

$("pendingRequests").innerHTML = "";
$("allRequests").innerHTML = "";

if (snapshot.empty) {
$("pendingRequests").textContent = "No student requests yet.";
$("allRequests").textContent = "No borrowing records yet.";
return;
}

let pendingCount = 0;

snapshot.forEach(requestDoc => {
const data = requestDoc.data();

const item = document.createElement("div");
item.className = "item";

const student = document.createElement("h3");
student.textContent = "Student: " + (data.studentName || "Unknown");

const equipment = document.createElement("p");
equipment.textContent = "Equipment: " + (data.equipmentName || "Unknown");

const status = document.createElement("p");
status.className = "status";
status.textContent = "Status: " + data.status;

item.append(student,equipment,status);

if (data.status === "Pending") {
pendingCount++;

const approveBtn = document.createElement("button");
approveBtn.className = "approve";
approveBtn.textContent = "Approve";

const rejectBtn = document.createElement("button");
rejectBtn.className = "reject";
rejectBtn.textContent = "Reject";

approveBtn.onclick = () => approveRequest(requestDoc.id);
rejectBtn.onclick = () => rejectRequest(requestDoc.id);

item.append(approveBtn,rejectBtn);

$("pendingRequests").appendChild(item.cloneNode(true));

// Add buttons to the actual pending request card too.
$("pendingRequests").lastElementChild.querySelectorAll("button")[0]
.onclick = () => approveRequest(requestDoc.id);

$("pendingRequests").lastElementChild.querySelectorAll("button")[1]
.onclick = () => rejectRequest(requestDoc.id);

} 

$("allRequests").appendChild(item);
});

if (pendingCount === 0) {
$("pendingRequests").textContent = "No pending requests.";
}

} catch(error) {
$("pendingRequests").textContent = error.message;
}
}

// Approve a borrowing request
async function approveRequest(requestId) {
try {
const requestRef = doc(db,"requests",requestId);
const requestSnap = await getDoc(requestRef);

if (!requestSnap.exists()) return alert("Request not found.");

const request = requestSnap.data();

// Prevent an administrator from approving their own request.
if (request.studentId === adminUser.uid) {
return alert("You cannot approve your own borrowing request.");
}

if (request.status !== "Pending") {
return alert("This request has already been processed.");
}

const equipmentRef = doc(db,"equipment",request.equipmentId);
const equipmentSnap = await getDoc(equipmentRef);

if (!equipmentSnap.exists()) {
return alert("Equipment does not exist.");
}

const equipment = equipmentSnap.data();

if (equipment.available === false || equipment.status === "Borrowed") {
return alert("This equipment is no longer available.");
}

if (!confirm("Approve this student's borrowing request?")) return;

await updateDoc(requestRef,{
status:"Approved",
approvedBy:adminUser.uid,
approvedAt:serverTimestamp()
});

await updateDoc(equipmentRef,{
available:false,
status:"Borrowed"
});

alert("Request approved successfully!");

await loadRequests();
await loadEquipment();

} catch(error) {
alert("Approval failed: " + error.message);
}
}

// Reject a borrowing request
async function rejectRequest(requestId) {
try {
const requestRef = doc(db,"requests",requestId);
const requestSnap = await getDoc(requestRef);

if (!requestSnap.exists()) return alert("Request not found.");

const request = requestSnap.data();

if (request.studentId === adminUser.uid) {
return alert("You cannot process your own borrowing request.");
}

if (request.status !== "Pending") {
return alert("This request has already been processed.");
}

if (!confirm("Reject this borrowing request?")) return;

await updateDoc(requestRef,{
status:"Rejected",
rejectedBy:adminUser.uid,
rejectedAt:serverTimestamp()
});

alert("Request rejected.");

await loadRequests();

} catch(error) {
alert("Rejection failed: " + error.message);
}
}

// Display equipment
async function loadEquipment() {
if (!adminUser) return;

const container = $("equipmentList");
container.textContent = "Loading...";

try {
const snapshot = await getDocs(collection(db,"equipment"));
container.innerHTML = "";

if (snapshot.empty) {
container.textContent = "No equipment added yet.";
return;
}

snapshot.forEach(item => {
const data = item.data();
const div = document.createElement("div");
div.className = "item";

const name = document.createElement("strong");
name.textContent = data.name || "Unnamed equipment";

const status = document.createElement("p");
status.textContent = "Status: " +
(data.available === false || data.status === "Borrowed"
? "Borrowed" : "Available");

div.append(name,status);
container.appendChild(div);
});

} catch(error) {
container.textContent = error.message;
}
}
</script>
</body>
</html>
